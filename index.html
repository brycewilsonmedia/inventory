  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fbf9f4;
      --ink: #0f1c28;
      --muted: #5d6a75;
      --line: #d8d2c3;
      --brass: #a97f24;
      --ok: #1f6b49;
      --ok-bg: #dcece3;
      --low: #8a5a00;
      --low-bg: #f6e6c0;
      --out: #8c2f26;
      --out-bg: #f1d9d5;
      --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
      --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c1721;
        --surface: #12212e;
        --ink: #ece7da;
        --muted: #93a1ad;
        --line: #26384a;
        --brass: #d3a948;
        --ok: #7fd1a3;
        --ok-bg: #153427;
        --low: #f0c35c;
        --low-bg: #3a2e10;
        --out: #f19a8f;
        --out-bg: #3b1b18;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

    header.masthead {
      padding: 56px 0 36px;
      border-bottom: 2px solid var(--ink);
    }
    .show {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: .04em;
      color: var(--brass);
      margin: 0 0 4px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(3.5rem, 12vw, 8rem);
      line-height: .9;
      letter-spacing: -.01em;
      margin: 0;
    }
    .updated {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      font-size: .95rem;
      color: var(--muted);
    }
    .summary strong { color: var(--ink); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
      padding: 36px 0 64px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .photo {
      aspect-ratio: 1;
      background: #e2e2e4;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo .swatch {
      width: 38%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.2);
    }
    .photo .noimg { color: #5d6a75; font-size: .85rem; margin-top: 10px; }
    .photo .ph { display: flex; flex-direction: column; align-items: center; }

    .body { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.75rem;
      line-height: 1.05;
      margin: 0;
    }
    .meta { color: var(--muted); font-size: .95rem; margin: 2px 0 0; }
    .price { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; }

    .badge {
      display: inline-block;
      align-self: flex-start;
      font-size: .8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .badge.in { background: var(--ok-bg); color: var(--ok); }
    .badge.low { background: var(--low-bg); color: var(--low); }
    .badge.out { background: var(--out-bg); color: var(--out); }

    .desc { margin: 0; color: var(--muted); font-size: .95rem; }

    .sizes {
      display: grid;
      grid-template-columns: repeat(var(--cols, 5), 1fr);
      gap: 6px;
      margin-top: auto;
      padding-top: 6px;
    }
    .size {
      border: 1px solid var(--line);
      border-radius: 4px;
      text-align: center;
      padding: 8px 2px 6px;
    }
    .size .label { display: block; font-size: .8rem; color: var(--muted); }
    .size .qty { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; line-height: 1.1; }
    .size.low .qty { color: var(--low); }
    .size.gone { background: transparent; border-style: dashed; }
    .size.gone .qty, .size.gone .label { color: var(--muted); opacity: .6; }
    .size.gone .label { text-decoration: line-through; }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 40px;
      color: var(--muted);
      font-size: .9rem;
    }

    a:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  </style>
</head>

      {
        name: "Classic Logo Tee", color: "Black", hex: "#111", price: 15,
        image: IMAGES.classic,
        desc: "The original Second Watch logo tee on soft black cotton.",
        sizes: { S: null, M: null, L: 1, XL: null, "2XL": null }
      },
      {
        name: "Second Watch Polo", color: "Black", hex: "#111", price: 25,
        image: IMAGES.polo,
        desc: "Black pique polo with the Second Watch microphone print on the chest.",
        sizes: { S: null, M: null, L: null, XL: null, "2XL": null }
      },
      {
        name: "Second Watch Hoodie", color: "Black", hex: "#111", price: 35,
        image: IMAGES.hoodie,
        desc: "Heavyweight black pullover hoodie with drawcord hood and chest print.",
        sizes: { S: null, M: null, L: null, XL: null, "2XL": null }
      },
      {
        name: "Second Watch Trucker Cap", color: "Black", hex: "#111", price: 12,
        image: IMAGES.cap,
        desc: "Black trucker cap with the full Second Watch logo stitched on the front.",
        sizes: { "One size": null }
      }
    ];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function status(p) {
      var total = 0;
      Object.keys(p.sizes).forEach(function (k) { total += p.sizes[k] || 0; });
      if (total === 0) return { key: "out", label: "Out of stock", total: total };
      // Low if total is small OR at least half the sizes are gone with few units left
      if (total <= LOW_THRESHOLD) return { key: "low", label: "Low stock", total: total };
      return { key: "in", label: "In stock", total: total };
    }

    function render() {
      document.getElementById("updated").textContent = UPDATED;
      document.getElementById("updated").setAttribute("datetime", UPDATED);

      var grid = document.getElementById("grid");
      var counts = { in: 0, low: 0, out: 0 };
      var units = 0;

      grid.innerHTML = PRODUCTS.map(function (p) {
        var st = status(p);
        counts[st.key]++;
        units += st.total;
        var keys = Object.keys(p.sizes);

        var photo = p.image
          ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name + " — " + p.color) + '" loading="lazy">'
          : '<div class="ph"><div class="swatch" style="background:' + esc(p.hex) + '"></div><span class="noimg">Photo coming soon</span></div>';

        var sizes = keys.map(function (k) {
          var q = p.sizes[k];
          var gone = !q;
          var cls = gone ? "size gone" : (q <= 3 ? "size low" : "size");
          return '<div class="' + cls + '">' +
            '<span class="label">' + esc(k) + '</span>' +
            '<span class="qty">' + (gone ? "&mdash;" : q) + '</span>' +
            (gone ? '<span class="visually-hidden" hidden>Out of stock</span>' : "") +
            '</div>';
        }).join("");

        return '<article class="item">' +
          '<div class="photo">' + photo + '</div>' +
          '<div class="body">' +
            '<div class="head"><div><h2>' + esc(p.name) + '</h2>' +
            '<p class="meta">' + esc(p.color) + '</p></div>' +
            '<div class="price">$' + esc(p.price) + '</div></div>' +
            '<span class="badge ' + st.key + '">' + st.label + '</span>' +
            '<p class="desc">' + esc(p.desc) + '</p>' +
            '<div class="sizes" style="--cols:' + (keys.length === 1 ? 1 : keys.length) + '">' + sizes + '</div>' +
          '</div></article>';
      }).join("");

      document.getElementById("summary").innerHTML =
        '<span><strong>' + PRODUCTS.length + '</strong> items</span>' +
        '<span><strong>' + units + '</strong> units on hand</span>' +
        '<span><strong>' + counts.low + '</strong> low stock</span>' +
        '<span><strong>' + counts.out + '</strong> out of stock</span>';
    }

    render();
  </script>
